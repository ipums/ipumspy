[project]
name = "ipumspy"
version = "0.9.0"
description = "A collection of tools for working with IPUMS data"
readme = "README.md"
authors = [
    {name = "Kevin H. Wilson", email = "kevin_wilson@brown.edu"},
    {name = "Renae Rodgers", email = "rodge103@umn.edu"},
]
license = "MPL-2.0"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "pandas>=2.2.3,<4",
    "numpy>=2.0.0,<3",
    "click>=8.0.0,<9",
    "pyarrow>=23.0.0,<27",
    "requests[use_chardet_on_py3]>=2.32.5,<3",
    "importlib-metadata>=4.13.0,<5",
    "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
docs = [
    "beautifulsoup4>=4.12.3,<5",
    "Sphinx>=6.1.3,<7",
    "sphinx-autodoc-typehints>=1.22.0,<2",
    "sphinx-copybutton>=0.5.0,<0.6",
    "myst-parser>=0.19.1,<0.20",
    "furo>=2022.12.7,<2023",
]

[project.scripts]
ipums = "ipumspy.cli:cli"

[dependency-groups]
dev = [
    "black>=24.4.0,<25",
    "pylint>=3.3,<5",
    "isort>=5.8.0,<6",
    "mypy>=1.0.1,<2",
]
test = [
    "pytest>=9.0.0,<10",
    "pytest-cov>=4.0.0,<5",
    "python-dotenv>=1.0.0,<2",
    "fastapi>=0.128.1,<0.129",
    "uvicorn[standard]>=0.40.0,<0.41",
    "pytest-recording>=0.13.4,<0.14",
    "vcrpy>=8.0.0,<9",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.pylint.basic]
good-names = "i,j,k,ex,Run,_,df,pc"

[tool.pylint.messages_control]
disable = "C0330, C0326, R0912, R0913, R0914, R0915"

[tool.pylint.format]
max-line-length = "88"

[tool.pytest.ini_options]
markers = [ "slow: Run with --runslow",
            "integration: Run with --runint" ]

[tool.coverage.run]
omit = [
    "*/tests/*",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ipumspy"]
