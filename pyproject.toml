[project]
name = "ipumspy"
version = "1.0.0"
description = "A collection of tools for working with IPUMS data"
authors = [
    { name = "Kevin H. Wilson", email = "kevin_wilson@brown.edu" },
    { name = "Renae Rodgers", email = "rodge103@umn.edu" }
]
license = { text = "Mozilla Public License 2.0 (MPL 2.0)" }
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.3,<3.0",
    "numpy>=2.0.0",
    "click>=8.0.0",
    "pyarrow>=23.0.0",
    "requests[use_chardet_on_py3]>=2.32.5",
    "importlib-metadata>=4.13.0",
    "PyYAML>=6.0.1",
]

[project.scripts]
ipums = "ipumspy.cli:cli"

# PEP 735 standard for development environment dependency management
[dependency-groups]
dev = [
    "black>=24.4.0",
    "pylint>=2.7.4",
    "isort>=5.8.0",
    "mypy>=1.0.1",
]
test = [
    "pytest>=9.0.0",
    "pytest-cov>=4.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.128.1",
    "uvicorn[standard]>=0.40.0",
    "pytest-recording>=0.13.4",
    "vcrpy>=8.0.0",
]
docs = [
    "beautifulsoup4>=4.12.3",
    "Sphinx>=6.1.3",
    "sphinx-autodoc-typehints>=1.22.0",
    "sphinx-copybutton>=0.5.0",
    "myst-parser>=0.19.1",
    "furo>=2022.12.7",
]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.pylint.basic]
good-names = "i,j,k,ex,Run,_,df,pc"

[tool.pylint.messages_control]
disable = "C0330, C0326, R0912, R0913, R0914, R0915"

[tool.pylint.format]
max-line-length = "88"

[tool.pytest.ini_options]
markers = [ 
    "slow: Run with --runslow",
    "integration: Run with --runint" 
]

[tool.coverage.run]
omit = [
    "*/tests/*",
]

# Standard modern build backend (Hatchling is standard and pairs great with uv)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ipumspy"]