name: build test lint

on:
  push:
    branches: [ master, test_actions ]
  pull_request:
    branches: [ master ]

jobs:
  run_tests:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      # Installs uv and sets up native dependency caching automatically
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # Ensures dependencies align strictly to your uv.lock file
      - name: Install dependencies
        run: uv sync --frozen --group test

      # - name: Run mypy
      #   run: uv run mypy src

      - name: Check styling
        run: uv run black . --check

      - name: Run tests
        env:
          # now has creds to run integration tests
          IPUMS_API_KEY: ${{ secrets.IPUMS_API_KEY }}
        run: uv run pytest --runint
