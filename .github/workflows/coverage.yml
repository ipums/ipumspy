name: CodeCov
on:
  push:
    branches: [ master, test_actions ]
  pull_request:
    branches: [ master ]
jobs:
  run_tests:
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate Report
        env:
          # now has creds to run integration tests
          IPUMS_API_KEY: ${{ secrets.IPUMS_API_KEY }}
        # this runs successfully at the command line and generates a report
        run: uv run --locked pytest --runint --cov=ipumspy --cov-report=xml

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{secrets.CODECOV_TOKEN}}
